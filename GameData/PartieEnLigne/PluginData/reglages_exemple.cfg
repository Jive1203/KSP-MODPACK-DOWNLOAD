# Partie en ligne KSP 2 dans KSP 1 : reglages de ce joueur.
# Au premier lancement, le jeu copie ce fichier en reglages.cfg : c'est reglages.cfg qu'il faut remplir.
# Mode d'emploi : LISEZMOI.txt, dans ce dossier.

# Le depot ou l'univers attend le prochain hote (le meme pour tous les joueurs) : github:COMPTE/NOM_DU_DEPOT
depot =
# Le jeton GitHub limite a ce depot (le meme pour tous). Ne le donne qu'aux joueurs de la partie.
jeton =

# Ton nom dans la partie. Vide : ton nom de joueur LMP.
joueur =
# Quand tu heberges : l'adresse ou les autres te rejoignent, avec le port (exemple : 100.64.12.34:8800).
adresse =
port = 8800
# Mot de passe de la partie, le meme pour tous (vide : aucun).
motdepasse =

# Ouvrir le port tout seul sur ta box (UPnP) : oui ou non. Coupe par defaut.
upnp = non
# Adresse ou ton serveur ecoute : :: pour tout le reseau, 127.0.0.1 pour ce PC seulement (essais).
ecoute = ::
# Avance : secondes entre deux signes de vie, deux copies de l'univers, et delai avant qu'un hote muet perde sa place.
battement = 60
envoi = 300
expiration = 180
