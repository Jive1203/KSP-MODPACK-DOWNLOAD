// Pack « KSP 2 dans KSP 1 » : Minor Planets Expansion (MPE) livre ses reglages Parallax a l'ancien format. Parallax Continued
// les convertit a chaque lancement, sans les activer, et ouvre la fenetre « Old Parallax configs detected ».
// On retire les anciens. Leurs versions converties ne sont pas activees : ces planetes n'ont pas le module de terrain
// de Parallax (erreur « Lon is missing the Parallax PQSMod » a l'essai du 08/11). Elles gardent donc leur aspect actuel.
!ParallaxScatters:HAS[#body[*]]:FINAL {}
@Parallax:HAS[@Body]:FINAL
{
	!Body,* {}
}