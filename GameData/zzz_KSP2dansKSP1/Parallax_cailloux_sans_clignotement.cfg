// Pack « KSP 2 dans KSP 1 » : les cailloux de Parallax clignotaient (signale par Jean le 08/11).
// Les configurations d'origine limitent le nombre de cailloux affiches (200 au plus pres de la camera sur la Mun),
// alors que le sol en contient bien plus : au-dela, Parallax en choisit d'autres a chaque image. On releve la limite.
@ParallaxScatters,*:FINAL
{
	@Body,*
	{
		@Scatter,*
		{
			@Optimizations
			{
				@maxRenderableObjectsLOD0 *= 8
				@maxRenderableObjectsLOD1 *= 8
				@maxRenderableObjectsLOD2 *= 8
			}
		}
	}
}
