// Pack « KSP 2 dans KSP 1 » : demande de Jean du 08/11, plus de gros rochers sur la Mun.
// On retire les grappes moyennes, grandes et enormes de Parallax ; seuls le gravier (Tiny) et les petits cailloux (Small) restent.
// Parallax n'est pas modifie : ce patch du pack enleve seulement ces familles de la configuration.
@ParallaxScatters:HAS[@Body:HAS[#name[Mun]]]:FINAL
{
	@Body:HAS[#name[Mun]]
	{
		!Scatter:HAS[#name[MedRocks]] {}
		!Scatter:HAS[#name[LargeRocks]] {}
		!Scatter:HAS[#name[HugeRocks]] {}
		!Scatter:HAS[#name[HugeRocks2]] {}
		!Scatter:HAS[#name[HugeRocks41]] {}
	}
}
