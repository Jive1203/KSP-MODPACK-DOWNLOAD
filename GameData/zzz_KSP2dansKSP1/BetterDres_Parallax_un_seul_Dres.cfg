// Pack « KSP 2 dans KSP 1 » : correctif de BetterDres avec Parallax.
// Le patch « @ParallaxScatters:FOR[BetterDres] » de BetterDres vise tous les noeuds ParallaxScatters
// (un par corps, 36 avec Promised Worlds et MPE) : il ajoute son Dres a chacun. Parallax ecrit alors
// 35 fois « Parallax Scatter config for Dres already exists, skipping! » et 36 fois « Sanity check ».
// On ne garde qu'un Dres, celui de BetterDres (fait pour son relief), dans le noeud de Dres.

// 1. Partout ou le noeud porte un autre corps, le Dres ajoute est de trop
@ParallaxScatters:HAS[@Body:HAS[~name[Dres]]]:AFTER[BetterDres]
{
	!Body[Dres] {}
}

// 2. Le noeud de Dres porte alors celui de Parallax (le premier) et celui de BetterDres : on garde BetterDres
@ParallaxScatters:HAS[@Body[Dres]]:AFTER[BetterDres]
{
	!Body[Dres],0 {}
}

// 3. Relief : BetterDres a son propre ParallaxTerrain de Dres, deja charge en premier (le dossier passe avant
// Parallax_StockTerrainTextures). On retire celui de Parallax : plus de « Terrain config for Dres already exists ».
@ParallaxTerrain:HAS[@Body:HAS[~name[Dres]]]:AFTER[BetterDres]
{
	!Body[Dres] {}
}
