// Pack « KSP 2 dans KSP 1 » : correctif de Minor Planets Expansion (MPE).
// Flake, Havous et Kal reprennent les rochers de Minmus, dont les textures integrees
// (MinmusIceBoulder, MinmusSnowBoulder, MinmusBoulder) ne sont pas chargees dans ce pack :
// Kopernicus ouvre une fenetre « Missing Textures » a chaque lancement (signale par Jean le 07/11).
// On les remplace par celles des rochers de la Mun, presentes et deja utilisees par d'autres corps de MPE.
// La couleur de chaque rocher (blanc bleute pour la glace et la neige) reste celle de MPE.
// Un bloc par corps : « @Body[Flake|Havous|Kal] » ne trouvait rien (essai du 07/11, 21 h 36).
@Kopernicus:AFTER[MPE]
{
	@Body[Flake]
	{
		@PQS
		{
			@Mods
			{
				@LandControl,*
				{
					@Scatters
					{
						@Value,*
						{
							@Material
							{
								@mainTex ^= :^BUILTIN/Minmus(Ice|Snow)Boulder.*$:BUILTIN/MunBoulder [Diffuse]:
								@bumpMap ^= :^BUILTIN/MinmusBoulder.*$:BUILTIN/MunBoulder [Normal]:
							}
						}
					}
				}
			}
		}
	}
	@Body[Havous]
	{
		@PQS
		{
			@Mods
			{
				@LandControl,*
				{
					@Scatters
					{
						@Value,*
						{
							@Material
							{
								@mainTex ^= :^BUILTIN/Minmus(Ice|Snow)Boulder.*$:BUILTIN/MunBoulder [Diffuse]:
								@bumpMap ^= :^BUILTIN/MinmusBoulder.*$:BUILTIN/MunBoulder [Normal]:
							}
						}
					}
				}
			}
		}
	}
	@Body[Kal]
	{
		@PQS
		{
			@Mods
			{
				@LandControl,*
				{
					@Scatters
					{
						@Value,*
						{
							@Material
							{
								@mainTex ^= :^BUILTIN/Minmus(Ice|Snow)Boulder.*$:BUILTIN/MunBoulder [Diffuse]:
								@bumpMap ^= :^BUILTIN/MinmusBoulder.*$:BUILTIN/MunBoulder [Normal]:
							}
						}
					}
				}
			}
		}
	}
}
