// Pack « KSP 2 dans KSP 1 » : trois pieces ou decors dont le modele etait introuvable
// (« PartCompiler: Model was not compiled correctly » a chaque lancement, piece invisible).

// 1. Lampe de test de Sterling Systems : faute dans le chemin (Utility au lieu de Utilities), le modele existe
@PART[strl-lum-test]:FOR[zzz_KSP2dansKSP1]
{
	@MODEL
	{
		@model = SterlingSystems/Utilities/Lights/S0Lamp
	}
}

// 2. Mini-foreuse Gold Digger de WBI : elle reprend le modele de la foreuse radiale du jeu, que ReStock
// retire du chargement (KSP2dansKSP1.restockwhitelist le garde), et sa texture est dans 0WBIResources
@PART[WBI_MiniDrill]:FOR[zzz_KSP2dansKSP1]
{
	@MODEL
	{
		@texture = TriBitDrill, WildBlueIndustries/0WBIResources/Parts/GoldDigger/GoldDigger
	}
}

// 3. Ecran tete haute d'OPT fait pour RasterPropMonitor, absent du pack : sans RPM il ne peut pas marcher.
// On le retire, et du cockpit qui l'utilise, tant que RPM n'est pas installe.
!PROP[RasterPropMonitorBasicHUD_OPTver]:NEEDS[!RasterPropMonitor]:FOR[zzz_KSP2dansKSP1] {}
@INTERNAL[phIVA]:NEEDS[!RasterPropMonitor]:FOR[zzz_KSP2dansKSP1]
{
	!PROP:HAS[#name[RasterPropMonitorBasicHUD_OPTver]] {}
}
