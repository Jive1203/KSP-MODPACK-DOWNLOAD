// Plan des filons (10/11) : toute soute, benne ou conteneur de Chantiers peut prendre le minerai d'un chantier proche (Stock.cs)
@PART[CH*]:HAS[@MODULE[ModuleB9PartSwitch]:HAS[#moduleID[cargaison]],!MODULE[ModuleChargeChantier]]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleChargeChantier
	}
}
@PART[CHBenne]:HAS[!MODULE[ModuleChargeChantier]]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleChargeChantier
	}
}
