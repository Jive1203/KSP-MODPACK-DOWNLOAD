// Pelles et roues-pelles qui creusent (Pelles.cs). echelle = celle du modele (pieces.py), debit en tonnes par seconde au plus.
// Valeurs de depart, a equilibrer : la roue-pelle est la machine au plus fort debit, la pelle travaille par godets.
@PART[CHGodetLeger]:FOR[Chantiers]
{
	MODULE
	{
		name = ModulePelle
		echelle = 0.55
		debit = 0.03
		electricite = 0.5
	}
}
@PART[CHGodet]:FOR[Chantiers]
{
	MODULE
	{
		name = ModulePelle
		echelle = 1.0
		debit = 0.25
		electricite = 2
	}
}
@PART[CHGodetLourd]:FOR[Chantiers]
{
	MODULE
	{
		name = ModulePelle
		echelle = 3.0
		debit = 1.5
		electricite = 15
	}
}
@PART[CHRouePelleLegere]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleRouePelle
		echelle = 0.55
		debit = 0.04
		electricite = 2
	}
}
@PART[CHRouePelle]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleRouePelle
		echelle = 1.0
		debit = 0.3
		electricite = 8
	}
}
@PART[CHRouePelleLourde]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleRouePelle
		echelle = 4.2
		debit = 2.0
		electricite = 120
	}
}
