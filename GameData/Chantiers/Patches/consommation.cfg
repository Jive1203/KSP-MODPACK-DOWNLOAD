// Consommation electrique de toutes les pieces Chantiers (Jean, 20/11 : realiste, pour tous les objets).
// Deja dans leurs modules : foreuses (4 / 12 / 80 par seconde), pelles (0,5 / 2 / 15 en creusant), roues-pelles (2 / 8 / 120 en creusant),
// concasseur 12, separateur 8, four 40 (120 pour les exotiques), electrolyseur 30, projecteur 0,15, spectrometre 1,5, carottier 3,
// sondeur 40 par tir, penetrateur sur sa batterie, ecope 15. Ici : ce qui manquait. Ordres de grandeur du jeu de base :
// un phare 0,04 par seconde, un moteur de roue de rover 1 a 3, un ISRU 30.

// Roues-pelles : le moteur tourne aussi a vide
@PART[CHRouePelleLegere]:FOR[Chantiers] { @MODULE[ModuleRotation] { %electricite = 1 } }
@PART[CHRouePelle]:FOR[Chantiers] { @MODULE[ModuleRotation] { %electricite = 4 } }
@PART[CHRouePelleLourde]:FOR[Chantiers] { @MODULE[ModuleRotation] { %electricite = 30 } }

// Convoyeur : moteur de la bande, avec interrupteur ; la bande ne defile qu'alimentee
@PART[CHConvoyeur]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleConsommation
		usage = Moteur de bande
		electricite = 1.2
		interrupteur = true
	}
}

// Feux : balise de chantier et feu d'obstacle du mat
@PART[CHBalise]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleConsommation
		usage = Feu de balise
		electricite = 0.03
		interrupteur = true
	}
}
@PART[CHMatForage]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleConsommation
		usage = Feu d'obstacle
		electricite = 0.02
		interrupteur = true
	}
}

// Noyau de colonie : ordinateur et regulation de la cargaison en veille
@PART[CHNoyauColonie]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleConsommation
		usage = Veille du noyau
		electricite = 0.5
	}
}

// Habitat gonflable : air, chauffage et eclairage, seulement s'il est occupe
@PART[CHModuleGonflable]:FOR[Chantiers]
{
	MODULE
	{
		name = ModuleConsommation
		usage = Vie a bord
		electricite = 1.5
		equipage = true
	}
}

// Soutes, bennes, conteneurs : la goulotte de chargement (ModuleChargeChantier, 2 par tonne par defaut)
@PART[CHBenne|CHBenneRover|CHBenneCamion]:HAS[@MODULE[ModuleChargeChantier]]:AFTER[Chantiers] { @MODULE[ModuleChargeChantier] { %electriciteParTonne = 3 } }
