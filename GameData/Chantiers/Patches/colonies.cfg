// Seuls nos batiments restent proposes : les quatre ci-dessus ont garde leur fonctionnement, avec nos modules
-KCFacilityConfig:HAS[~name[CH*],~name[KCECStorage],~name[KCcommNetFacility_T1],~name[KCResearchFacility],~name[KCFissionreactorFacility]]:FOR[Chantiers] {}

// Seul le Noyau de colonie peut fonder une colonie. Kerbal Colonies donne ce pouvoir a tous les postes de commande : on le leur retire.
@PART[*]:HAS[@MODULE[KCPartModule]]:FOR[Chantiers]
{
	-MODULE[KCPartModule] {}
}

@PART[CHNoyauColonie]:AFTER[Chantiers]
{
	MODULE
	{
		name = KCPartModule
	}
}

// Un seul batiment de fondation, le notre : c'est lui que paie la cargaison du noyau
-KCFacilityConfig[CAB]:FOR[Chantiers] {}
