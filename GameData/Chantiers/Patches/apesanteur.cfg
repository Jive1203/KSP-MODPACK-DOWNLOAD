// Fabrication en apesanteur (Apesanteur.cs) dans le laboratoire mobile de Squad (MPL-LG-2) : ne marche qu'en chute libre (en orbite,
// sans poussee). Silicates et metal en entree, cristaux d'apesanteur en sortie, gardes dans le laboratoire (200 kg).
@PART[Large_Crewed_Lab]:AFTER[Chantiers]
{
	MODULE
	{
		name = ModuleApesanteur
	}
	RESOURCE
	{
		name = CristauxOrbitaux
		amount = 0
		maxAmount = 200
	}
}
