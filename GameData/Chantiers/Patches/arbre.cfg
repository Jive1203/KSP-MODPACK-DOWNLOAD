// Arbre de recherche des pieces de Chantiers (10/11) : tout est ici, en un seul endroit. Arbre de base du jeu (65 noeuds, pas de mod
// d'arbre dans le pack). Logique : on prospecte d'abord, puis on mine avec de petits outils de rover, puis avec des machines,
// puis on fonde une colonie et on exploite en grand ; l'helium-3 des geantes vient a la fin, avec la fusion.
//   Space Exploration (90)        : penetrateur, balise de chantier (on marque un gisement des les premiers atterrissages)
//   Electrics (90)                : projecteur de mine
//   Advanced Construction (90)    : outils de rover, tier 1 (foreuse, godet, roue-pelle legers), benne de rover, petite soute, etai
//   Advanced Exploration (160)    : carottier
//   Specialized Construction (160): machines du tier 2, convoyeur, benne, concasseur, separateur, soutes et conteneurs 1,25 et 2,5 m
//   Scanning Tech (300)           : spectrometre orbital (avec les scanners du jeu)
//   Field Science (300)           : sondeur sismique de rover
//   Advanced MetalWorks (300)     : machines du tier 3 (foreuse de chantier, jambes, mat, gros godet, grande roue-pelle), four, noyau de colonie
//   Large Volume Containment (300): soute et conteneur de 3,75 m, benne de camion
//   Composites (300)              : habitat gonflable
//   High-Power Electrics (300)    : electrolyseur
//   High-Performance Fuel Systems (550) : ecope d'helium-3
// Les modules de batiments (CHM...) restent caches : ils ne se recherchent pas, la colonie les fabrique.

@PART[CHPenetrateur|CHBalise]:LAST[Chantiers] { @TechRequired = spaceExploration }
@PART[CHProjecteur]:LAST[Chantiers] { @TechRequired = electrics }
@PART[CHForeuseLegere|CHGodetLeger|CHRouePelleLegere|CHBenneRover|CHSoute0|CHEtai]:LAST[Chantiers] { @TechRequired = advConstruction }
@PART[CHCarottier]:LAST[Chantiers] { @TechRequired = advExploration }
@PART[CHForeuse|CHGodet|CHRouePelle|CHConvoyeur|CHBenne|CHConcasseur|CHSeparateur|CHSoute1|CHSoute2|CHConteneur1|CHConteneur2]:LAST[Chantiers] { @TechRequired = specializedConstruction }
@PART[CHSpectrometre]:LAST[Chantiers] { @TechRequired = scienceTech }
@PART[CHSondeur]:LAST[Chantiers] { @TechRequired = fieldScience }
@PART[CHForeuseLourde|CHJambeForage|CHMatForage|CHGodetLourd|CHRouePelleLourde|CHFour|CHNoyauColonie]:LAST[Chantiers] { @TechRequired = advMetalworks }
@PART[CHSoute3|CHConteneur3|CHBenneCamion]:LAST[Chantiers] { @TechRequired = largeVolumeContainment }
@PART[CHModuleGonflable]:LAST[Chantiers] { @TechRequired = composites }
@PART[CHElectrolyseur]:LAST[Chantiers] { @TechRequired = largeElectrics }
@PART[CHEcope]:LAST[Chantiers] { @TechRequired = highPerformanceFuelSystems }
