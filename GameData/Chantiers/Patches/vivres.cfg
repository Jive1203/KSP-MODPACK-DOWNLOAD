// Survie a bord (VivresBord.cs) : toute piece habitee recoit le module et 10 jours de nourriture par place (0,31 kg par jour).
// Pas les Kerbals en sortie (KerbalEVA), ni les pieces qui l'ont deja.
@PART[*]:HAS[#CrewCapacity[>0],!MODULE[KerbalEVA],!MODULE[ModuleVivres]]:AFTER[Chantiers]
{
	MODULE
	{
		name = ModuleVivres
	}
}
@PART[*]:HAS[#CrewCapacity[>0],!MODULE[KerbalEVA],!RESOURCE[Nourriture]]:AFTER[Chantiers]
{
	RESOURCE
	{
		name = Nourriture
		amount = #$../CrewCapacity$
		@amount *= 3.1
		maxAmount = #$../CrewCapacity$
		@maxAmount *= 3.1
	}
}
