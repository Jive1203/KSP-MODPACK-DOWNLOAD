PART
{
	name = CHForeuse
	module = Part
	author = Chantiers
	MODEL { model = Chantiers/Parts/foreuse }
	rescaleFactor = 1
	node_stack_top = 0.0, 0.55, 0.0, 0.0, 1.0, 0.0, 1
	node_attach = 0.0, 0.55, 0.0, 0.0, 1.0, 0.0, 0
	TechRequired = advScienceTech
	entryCost = 9000
	cost = 3200
	category = Utility
	subcategory = 0
	title = Foreuse de roche CH-F2
	manufacturer = Chantiers
	description = Tête de forage à couronne. Elle fore un puits sous elle, très lentement mais sans s'arrêter, même quand personne n'est là. Une zone demande des mois de travail.
	attachRules = 1,1,1,1,0
	mass = 0.9
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.2
	angularDrag = 2
	crashTolerance = 12
	maxTemp = 1800
	bulkheadProfiles = size1, srf
	tags = foreuse forage minage drill mine chantier
	MODULE
	{
		name = ModuleForeuse
		debit = 0.05
		recuperation = 2
		rayonCoup = 1.6
		rayonPuits = 6
		course = 30
		electricite = 12
	}
}

